name: "Chromatic"

on: push

jobs:
  chromatic:
    name: Run Chromatic
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with: 
          bun-version: 1.2.23
      - name: Install dependencies
        run: bun install
      - name: Build
        run: bun run build
      - name: Run Chromatic
        uses: chromaui/action@latest
        with:
          projectToken: chpt_dbbbee77ced9662
          workingDir: examples/rnw-example
